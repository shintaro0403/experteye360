# GitHub Pages: 受講者・管理者 Web を公開（フェーズ 2 別端末確認用）
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            participant-web/package-lock.json
            admin-web/package-lock.json

      - name: Install dependencies (root + both web apps)
        run: npm run install:all

      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          VITE_PAGES_REPO: experteye360
          VITE_STORAGE_BACKEND: sheet
          VITE_CLIENT_ID: ${{ vars.VITE_CLIENT_ID }}
          VITE_SHEET_API_BASE: ${{ vars.VITE_SHEET_API_BASE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
