# 最小 CI: テスト・型チェック・ビルド（秘密情報不要）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            participant-web/package-lock.json
            admin-web/package-lock.json

      - name: No tracked env files (.env.development 等)
        run: npm run check:no-env

      - name: Install dependencies (root + both web apps)
        run: npm run install:all

      - name: Vitest (shared + admin-web + participant-web)
        run: npm test

      - name: Typecheck participant-web
        run: npm run typecheck --prefix participant-web

      - name: Typecheck admin-web
        run: npm run typecheck --prefix admin-web

      - name: Build participant-web and admin-web
        run: npm run build:all

      # mock E2E（実 GAS は env 未設定で自動 skip。Secrets 不要）
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (mock, Playwright)
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
